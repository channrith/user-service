server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # url: jdbc:mysql://localhost:3306/user_service_db
    url: jdbc:mariadb://localhost:3306/user_service_db
    username: root
    password: secret
    # driver-class-name: org.mysql.cj.jdbc.Driver
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # Options: none, validate, update, create, create-drop
    # database-platform: org.hibernate.dialect.MariaDBDialect
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true # Logs SQL queries in the console

# JWT (use a long secret in production, e.g. env JWT_SECRET)
jwt:
  secret: ${JWT_SECRET:VGK9Ui1qwyp1b1GwtmhsZ1USBsglV8fu1pwk0bJCUNw=}
  expiration-seconds: 86400
