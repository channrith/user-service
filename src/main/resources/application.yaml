server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # url: jdbc:mysql://localhost:3306/user_service_db
    url: jdbc:mariadb://localhost:3306/user_service_db
    username: root
    password: secret
    # driver-class-name: org.mysql.cj.jdbc.Driver
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # Options: none, validate, update, create, create-drop
    # database-platform: org.hibernate.dialect.MariaDBDialect
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true # Logs SQL queries in the console

# JWT: RS256 with PKCS#8 RSA private key; JWKS at /.well-known/jwks.json for other services.
# Set JWT_PRIVATE_KEY_LOCATION if the default path does not match your working directory (e.g. file:jwt-keys/private_pkcs8.pem from repo root).
jwt:
  issuer: ${JWT_ISSUER_URI:http://localhost:8081}
  key-id: ${JWT_KEY_ID:futureflow-1}
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:../jwt-keys/private_pkcs8.pem}
  expiration-seconds: 86400
